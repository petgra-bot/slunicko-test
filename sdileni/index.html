figcaption span{font-size:14px;opacity:.75}code{word-break:break-all}</style></head><body><main><h1>Obrázek pro sdílení odkazu</h1>
<p>Takhle se web ukáže, když někdo pošle odkaz ve WhatsAppu, Messengeru nebo na Facebooku. Každou variantu si můžete vyzkoušet poslaným odkazem pod obrázkem (po nahrání na test). <a href="../">← všechny návrhy</a></p><figure><img src="1-modelka-vlevo.jpg" alt="Varianta 1" width="1200" height="630" loading="lazy"><figcaption><b>1</b> Modelka vlevo, logo a údaje vpravo na máslovém podkladu<br><span>Odkaz k vyzkoušení v WhatsAppu: <code>https://www.studioslunicko.cz/test-novy-web/sdileni/1/</code></span></figcaption></figure><figure><img src="2-modelka-pres-cele.jpg" alt="Varianta 2" width="1200" height="630" loading="lazy"><figcaption><b>2</b> Modelka přes celý obrázek jako dnešní úvodní strana, text „Těšíme se na vás“<br><span>Odkaz k vyzkoušení v WhatsAppu: <code>https://www.studioslunicko.cz/test-novy-web/sdileni/2/</code></span></figcaption></figure><figure><img src="3-modelka-ve-slunci.jpg" alt="Varianta 3" width="1200" height="630" loading="lazy"><figcaption><b>3</b> Žluté pozadí, modelka v kruhu jako slunce, logo na bílé kartičce<br><span>Odkaz k vyzkoušení v WhatsAppu: <code>https://www.studioslunicko.cz/test-novy-web/sdileni/3/</code></span></figcaption></figure><figure><img src="4-cerna-zluta.jpg" alt="Varianta 4" width="1200" height="630" loading="lazy"><figcaption><b>4</b> Tmavá varianta s velkým „4,9 ★“ a modelkou vpravo<br><span>Odkaz k vyzkoušení v WhatsAppu: <code>https://www.studioslunicko.cz/test-novy-web/sdileni/4/</code></span></figcaption></figure><figure><img src="5-jen-logo.jpg" alt="Varianta 5" width="1200" height="630" loading="lazy"><figcaption><b>5</b> Bez fotky – jen logo, adresa a otevírací doba (aktuálně nasazeno)<br><span>Odkaz k vyzkoušení v WhatsAppu: <code>https://www.studioslunicko.cz/test-novy-web/sdileni/5/</code></span></figcaption></figure></main></body></html>
